name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - run: npm install
    # Test the internal packages against each other instead of their published releases
    - run: npx subpkg link
    - run: npm run test:integration
